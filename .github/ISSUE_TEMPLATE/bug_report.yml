name: Bug report
description: Report a reproducible problem with Agent Profiles
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include auth.json, account tokens, or unredacted personal information. Use preview mode for screenshots when possible.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and Mac architecture
      placeholder: macOS 15, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Include sanitized error text or a preview-mode screenshot if useful.
