name: CI
"on":
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate release metadata and repository hygiene
        run: |
          # The signing key is only required by the release workflow.
          python3 scripts/release_metadata.py check
          python3 scripts/check-repository.py
          python3 -m unittest discover -s scripts/tests -v
      - name: Run Swift regression tests
        run: make test
      - name: Build and verify universal packaged app
        env:
          BUILD_ARCHS: arm64 x86_64
        run: ./scripts/package-app.sh debug
  windows-core:
    # Only the cores exist off macOS (see Package.swift). Building them keeps
    # the Windows port possible; their tests still lean on symlinks and the
    # POSIX CLI shim, so they report without blocking until that layer lands.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057 # v0.5.0
        with:
          # swift.org names this release 6.4.0; the 6.4 paths 404.
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
      - name: Build the cores
        run: swift build --build-tests
      - name: Run Codex checks
        continue-on-error: true
        run: swift run CodexProfilesCheck
      - name: Run Swift tests
        continue-on-error: true
        run: swift test
