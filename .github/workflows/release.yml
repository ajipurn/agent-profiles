name: Release
"on":
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v1.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      BUILD_ARCHS: arm64 x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate tag and signing configuration
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 scripts/release_metadata.py check --require-key --tag "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'Configure the SPARKLE_PRIVATE_KEY repository secret.' >&2; exit 1; }
          python3 scripts/check-repository.py
          python3 -m unittest discover -s scripts/tests -v
      - name: Verify release version increases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-release-history.py
      - name: Run Swift regression tests
        run: make test
      - name: Configure optional Apple signing and notarization
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_API_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: ./scripts/configure-ci-signing.sh
      - name: Build universal app and signed update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/build-release.sh
      - name: Retain verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AgentProfiles-${{ env.RELEASE_TAG }}
          path: dist/releases/
          if-no-files-found: error
          retention-days: 14
      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-draft.sh "$RELEASE_TAG"
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/agent-signing.p12" "$RUNNER_TEMP/agent-notary.p8"
